<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@sg_change</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .header {
            text-align: center;
        }

        .header .tag {
            display: inline-block;
            color: #808080;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 6px;
        }

        .loading-text {
            color: #1a1a1a;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .card {
            width: 100%;
            background: #111111;
            border-radius: 20px;
            padding: 28px 24px 24px;
            border: 1px solid #1f1f1f;
            display: flex;
            flex-direction: column;
            gap: 24px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card.loaded {
            opacity: 1;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #707070;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            padding-left: 4px;
        }

        .field-label img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            opacity: 0.7;
        }

        .input-row {
            display: flex;
            align-items: center;
            background: #181818;
            border-radius: 12px;
            border: 1px solid #222;
            overflow: hidden;
            transition: border 0.2s;
        }

        .input-row:focus-within {
            border-color: #333;
        }

        .input-row input {
            background: none;
            border: none;
            outline: none;
            color: #d5d5d5;
            font-size: 22px;
            font-weight: 400;
            width: 100%;
            padding: 14px 16px;
            font-family: inherit;
            text-align: left;
            letter-spacing: 0.3px;
        }

        .input-row input::placeholder {
            color: #3a3a3a;
        }

        .stepper {
            display: flex;
            flex-direction: column;
            border-left: 1px solid #222;
            flex-shrink: 0;
        }

        .stepper button {
            width: 36px;
            height: 28px;
            border: none;
            background: #181818;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            font-family: inherit;
        }

        .stepper button:first-child {
            border-bottom: 1px solid #222;
        }

        .stepper button:hover {
            background: #202020;
            color: #bbb;
        }

        .stepper button:active {
            background: #282828;
        }

        .footer {
            text-align: center;
            color: #555;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .footer a {
            color: #4a9eff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #6bb3ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="tag">@sg_change</div>
        </div>

        <div class="loading-text" id="loadingText">Загружаю курс...</div>

        <div class="card" id="calculatorCard">
            <div class="field">
                <div class="field-label">
                    <img src="stars.png" alt="stars" />
                    Звёзды
                </div>
                <div class="input-row">
                    <input type="text" id="starsInput" placeholder="0" value="0" inputmode="numeric" />
                    <div class="stepper">
                        <button onclick="adjustStars(1)">▲</button>
                        <button onclick="adjustStars(-1)">▼</button>
                    </div>
                </div>
            </div>

            <div class="field">
                <div class="field-label">
                    <img src="gram.png" alt="gram" />
                    Грамы
                </div>
                <div class="input-row">
                    <input type="text" id="gramInput" placeholder="0" value="0" inputmode="numeric" />
                    <div class="stepper">
                        <button onclick="adjustGram(currentRate)">▲</button>
                        <button onclick="adjustGram(-currentRate)">▼</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            калькулятор <a href="https://telegram.me/sg_change" target="_blank">@sg_change</a>
        </div>
    </div>

    <script>
        const starsInput = document.getElementById('starsInput');
        const gramInput = document.getElementById('gramInput');
        const loadingText = document.getElementById('loadingText');
        const calculatorCard = document.getElementById('calculatorCard');
        
        let currentRate = 2700;
        let updating = false;

        async function loadRate() {
            try {
                const response = await fetch('https://api.vidokl.xyz/rate');
                const data = await response.json();
                currentRate = data.rate;
            } catch (error) {}
            
            loadingText.style.display = 'none';
            calculatorCard.classList.add('loaded');
            updateGramFromStars();
        }

        function formatNumber(num) {
            if (num === 0) return '0';
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }

        function parseFormatted(str) {
            return parseInt(str.replace(/\s/g, '')) || 0;
        }

        function updateGramFromStars() {
            const stars = parseFormatted(starsInput.value);
            gramInput.value = formatNumber(stars * currentRate);
        }

        function updateStarsFromGram() {
            const gram = parseFormatted(gramInput.value);
            starsInput.value = formatNumber(Math.round(gram / currentRate));
        }

        starsInput.addEventListener('input', () => {
            if (updating) return;
            updating = true;
            updateGramFromStars();
            updating = false;
        });

        gramInput.addEventListener('input', () => {
            if (updating) return;
            updating = true;
            updateStarsFromGram();
            updating = false;
        });

        function adjustStars(delta) {
            let current = parseFormatted(starsInput.value);
            current = Math.max(0, current + delta);
            starsInput.value = formatNumber(current);
            updateGramFromStars();
        }

        function adjustGram(delta) {
            let current = parseFormatted(gramInput.value);
            current = Math.max(0, current + delta);
            gramInput.value = formatNumber(current);
            updateStarsFromGram();
        }

        starsInput.value = formatNumber(0);
        gramInput.value = formatNumber(0);
        loadRate();
    </script>
</body>
</html>
