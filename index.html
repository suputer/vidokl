<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Спасибо за игру!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #fff;
            font-size: 36px;
            font-weight: normal;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .visits {
            color: #fff;
            font-size: 16px;
            opacity: 0.7;
        }

        #count {
            font-size: 72px;
            font-weight: bold;
            display: block;
            margin-top: 10px;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Спасибо за игру!</h1>
        <div class="visits">
            Посетили нас:
            <span id="count">...</span>
        </div>
    </div>

    <script>
        async function updateVisits() {
            try {
                const res = await fetch('https://api.vidokl.xyz/plus');
                const data = await res.json();
                document.getElementById('count').textContent = data.visits;
            } catch (e) {
                document.getElementById('count').textContent = '∞';
            }
        }

        updateVisits();
    </script>
</body>
</html>
