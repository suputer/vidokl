<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор @sg_change</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .header {
            text-align: center;
        }

        .header .tag {
            display: inline-block;
            color: #808080;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 6px;
        }

        .card {
            width: 100%;
            background: #111111;
            border-radius: 20px;
            padding: 28px 24px 24px;
            border: 1px solid #1f1f1f;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
        }

        .card.loading {
            opacity: 0.4;
            pointer-events: none;
        }

        .loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #555;
            font-size: 13px;
            letter-spacing: 0.5px;
            font-weight: 300;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-align: center;
        }

        .loading-text.show {
            opacity: 1;
        }

        .loading-text .dots {
            display: inline-block;
            animation: dots 1.4s infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #707070;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            padding-left: 4px;
        }

        .field-label img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            opacity: 0.7;
        }

        .field-label .rate-badge {
            background: #1a1a1a;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #888;
            margin-left: auto;
            letter-spacing: 0.3px;
        }

        .field-label .rate-badge span {
            color: #d5d5d5;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            align-items: center;
            background: #181818;
            border-radius: 12px;
            border: 1px solid #222;
            overflow: hidden;
            transition: border 0.2s;
        }

        .input-row:focus-within {
            border-color: #333;
        }

        .input-row input {
            background: none;
            border: none;
            outline: none;
            color: #d5d5d5;
            font-size: 22px;
            font-weight: 400;
            width: 100%;
            padding: 14px 16px;
            font-family: inherit;
            text-align: left;
            letter-spacing: 0.3px;
        }

        .input-row input::placeholder {
            color: #3a3a3a;
        }

        .stepper {
            display: flex;
            flex-direction: column;
            border-left: 1px solid #222;
            flex-shrink: 0;
        }

        .stepper button {
            width: 36px;
            height: 28px;
            border: none;
            background: #181818;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            font-family: inherit;
        }

        .stepper button:first-child {
            border-bottom: 1px solid #222;
        }

        .stepper button:hover {
            background: #202020;
            color: #bbb;
        }

        .stepper button:active {
            background: #282828;
        }

        .footer {
            text-align: center;
            color: #555;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .footer a {
            color: #4a9eff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #6bb3ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="tag">@sg_change</div>
        </div>

        <div class="card" id="calculatorCard">
            <div class="loading-text" id="loadingText">
                Загружаю курс...<span class="dots">.</span>
            </div>

            <div class="field">
                <div class="field-label">
                    <img src="stars.png" alt="stars" />
                    Звёзды
                    <span class="rate-badge">1⭐ → <span id="rateDisplay">--</span> GRAM</span>
                </div>
                <div class="input-row">
                    <input type="text" id="starsInput" placeholder="0" value="0" inputmode="numeric" />
                    <div class="stepper">
                        <button onclick="adjustStars(1)">▲</button>
                        <button onclick="adjustStars(-1)">▼</button>
                    </div>
                </div>
            </div>

            <div class="field">
                <div class="field-label">
                    <img src="gram.png" alt="gram" />
                    Грамы
                </div>
                <div class="input-row">
                    <input type="text" id="gramInput" placeholder="0" value="0" inputmode="numeric" />
                    <div class="stepper">
                        <button onclick="adjustGram(2700)">▲</button>
                        <button onclick="adjustGram(-2700)">▼</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            калькулятор <a href="https://telegram.me/sg_change" target="_blank">@sg_change</a>
        </div>
    </div>

    <script>
        const starsInput = document.getElementById('starsInput');
        const gramInput = document.getElementById('gramInput');
        const rateDisplay = document.getElementById('rateDisplay');
        const loadingText = document.getElementById('loadingText');
        const card = document.getElementById('calculatorCard');
        
        let RATE = 2700;
        let updating = false;

        function formatNumber(num) {
            if (num === 0) return '0';
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }

        function setLoading(loading) {
            if (loading) {
                card.classList.add('loading');
                loadingText.classList.add('show');
            } else {
                card.classList.remove('loading');
                loadingText.classList.remove('show');
            }
        }

        async function loadKurs() {
            setLoading(true);
            
            try {
                const response = await fetch('https://api.vidokl.xyz/kurs');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                
                if (data && data.rate) {
                    RATE = data.rate;
                    rateDisplay.textContent = RATE.toLocaleString();
                    updateGramFromStars();
                }
            } catch (error) {
                console.error('Ошибка загрузки курса:', error);
                rateDisplay.textContent = RATE.toLocaleString();
            } finally {
                setLoading(false);
            }
        }

        function updateGramFromStars() {
            if (updating) return;
            updating = true;
            
            let raw = starsInput.value.replace(/\s/g, '');
            let stars = parseInt(raw) || 0;
            if (stars < 0) stars = 0;
            
            starsInput.value = formatNumber(stars);
            gramInput.value = formatNumber(stars * RATE);
            
            updating = false;
        }

        function updateStarsFromGram() {
            if (updating) return;
            updating = true;
            
            let raw = gramInput.value.replace(/\s/g, '');
            let gram = parseInt(raw) || 0;
            if (gram < 0) gram = 0;
            
            gramInput.value = formatNumber(gram);
            starsInput.value = formatNumber(Math.round(gram / RATE));
            
            updating = false;
        }

        starsInput.addEventListener('input', updateGramFromStars);
        gramInput.addEventListener('input', updateStarsFromGram);

        function adjustStars(delta) {
            let raw = starsInput.value.replace(/\s/g, '');
            let current = parseInt(raw) || 0;
            current = Math.max(0, current + delta);
            starsInput.value = formatNumber(current);
            gramInput.value = formatNumber(current * RATE);
        }

        function adjustGram(delta) {
            let raw = gramInput.value.replace(/\s/g, '');
            let current = parseInt(raw) || 0;
            current = Math.max(0, current + delta);
            gramInput.value = formatNumber(current);
            starsInput.value = formatNumber(Math.round(current / RATE));
        }

        // Запуск
        starsInput.value = formatNumber(0);
        gramInput.value = formatNumber(0);
        loadKurs();
    </script>
</body>
</html>
